name: Release

# Runs on every push to main.
# - Pending changesets present  → opens/updates a "Version Packages" PR
# - "Version Packages" PR merged → builds & publishes to public npm
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org/
          scope: '@bambiste'

      # All deps (@medusajs, and the plugins themselves) are on public npm — no token.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # changesets/action does one of two things:
      #   1. Pending changesets present → opens/updates a "Version Packages" PR
      #   2. PR merged (no changesets left) → runs `pnpm release` (changeset publish);
      #      each plugin builds itself via its `prepublishOnly` (medusa plugin:build)
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
          # Tags already have GitHub Releases from the prior run — don't recreate them.
          createGithubReleases: false
        env:
          # Built-in token — pushes tags / opens the version PR on this repo. Needs
          # Settings → Actions → General → "Allow GitHub Actions to create and
          # approve pull requests" enabled for the version-PR path.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm publish auth — NPM_TOKEN must have publish rights to the @bambiste org on npm.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Self-healing dist-tag guard: make sure the intended tag always points at the
      # version currently in the workspace, so `npm i @bambiste/x` (which resolves
      # `latest`) — or `@next`/`@alpha` in prerelease mode — reaches the newest build.
      # Reconciles from workspace-vs-npm independently of the changesets output.
      - name: Reconcile dist-tags
        if: ${{ !cancelled() }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          # In changesets prerelease mode → the pre tag (next/alpha); otherwise latest.
          TAG=latest
          [ -f .changeset/pre.json ] && TAG=$(node -p "require('./.changeset/pre.json').tag")
          echo "Target dist-tag: $TAG"
          for pj in packages/*/package.json; do
            name=$(node -p "require('./$pj').name")
            ver=$(node -p "require('./$pj').version")
            priv=$(node -p "require('./$pj').private || false")
            [ "$priv" = "true" ] && continue
            # only (re)tag a version that is actually published on npm
            npm view "$name@$ver" version >/dev/null 2>&1 || { echo "  skip $name@$ver (not on npm)"; continue; }
            cur=$(npm dist-tag ls "$name" 2>/dev/null | awk -v t="$TAG:" '$1==t{print $2}')
            if [ "$cur" = "$ver" ]; then
              echo "  $name: $TAG already $ver"
            else
              npm dist-tag add "$name@$ver" "$TAG" && echo "  $name: $TAG → $ver (was ${cur:-none})"
            fi
          done

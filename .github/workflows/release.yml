name: Release

# Runs on every push to main.
# - Pending changesets present  → opens/updates a "Version Packages" PR
# - "Version Packages" PR merged → builds & publishes to GitHub Packages
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT so the changeset-release branch is pushed as a real user, which
          # lets the version PR be created even when the org blocks Actions from it.
          token: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: '@bambiste'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      # changesets/action does one of two things:
      #   1. Pending changesets present → opens/updates a "Version Packages" PR
      #   2. PR merged (no changesets left) → runs `pnpm release` (changeset publish);
      #      each plugin builds itself via its `prepublishOnly` (medusa plugin:build)
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  ci:
    name: Build affected
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: '@bambiste'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: nrwl/nx-set-shas@v4

      # Medusa plugins are validated by `medusa plugin:build`; the tsc-based
      # typecheck target doesn't apply to Medusa's tsconfig template.
      - name: Build affected
        run: pnpm nx affected -t build --parallel=3
        env:
          NODE_ENV: production
